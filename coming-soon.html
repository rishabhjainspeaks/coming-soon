<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Get in touch — Rishabh Jain</title>
<meta name="description" content="Get in touch with Rishabh Jain — for seminar and webinar invitations, mentorship, or a conversation."/>
<style>
:root{--bg:#ffffff;--bg2:#f5f5f7;--ink:#1d1d1f;--gray:#6e6e73;--blue:#0066cc;--line:#d2d2d7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:980px;margin:0 auto;padding:0 22px}

nav{position:sticky;top:0;z-index:50;backdrop-filter:saturate(180%) blur(20px);background:rgba(251,251,253,.8);border-bottom:1px solid rgba(0,0,0,.08)}
nav .in{max-width:980px;margin:0 auto;padding:0 22px;height:48px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:15px;font-weight:600;letter-spacing:-.01em}
.tabs{display:flex;gap:28px}
.tab{font-size:12.5px;color:rgba(29,29,31,.8);padding:4px 0}
.tab.on{color:var(--ink);font-weight:600}

.hero{text-align:center;padding:110px 22px 40px}
.kicker{font-size:14px;font-weight:600;color:var(--gray);margin-bottom:14px}
h1{font-size:clamp(44px,7.5vw,64px);font-weight:700;letter-spacing:-.028em;line-height:1.04;margin-bottom:18px}
.sub{font-size:clamp(19px,2.6vw,24px);color:var(--gray);font-weight:400;letter-spacing:-.01em;max-width:600px;margin:0 auto}

.form{max-width:520px;margin:0 auto;text-align:left;padding-bottom:60px}
.fl{margin-bottom:14px}
.fl input,.fl textarea{width:100%;padding:14px 16px;font-size:16px;border:1px solid var(--line);border-radius:12px;font-family:inherit;background:var(--bg);color:var(--ink)}
.fl input:focus,.fl textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,102,204,.15)}
.fl textarea{resize:vertical;min-height:120px}
.btn{background:var(--blue);color:#fff;font-family:inherit;font-size:16px;padding:12px 28px;border-radius:980px;border:none;cursor:pointer;transition:.2s;display:inline-block}
.btn:hover{background:#0055b0}
.center{text-align:center;margin-top:6px}

.socials{display:flex;gap:26px;justify-content:center;margin:20px 0 80px;flex-wrap:wrap;color:var(--gray);font-size:15px}

footer{border-top:1px solid var(--line);padding:26px 0;background:var(--bg2)}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--gray)}
</style>
</head>
<body>
<nav><div class="in">
  <div class="logo"><a href="index.html">Rishabh Jain</a></div>
  <div class="tabs">
    <a class="tab" href="index.html">Home</a>
    <span class="tab on">Get in touch</span>
  </div>
</div></nav>

<div class="hero">
  <div class="kicker">Get in touch</div>
  <h1>Let's talk.</h1>
  <p class="sub">Seminar, webinar invitations, mentorship — or just a good conversation.</p>
</div>

<!-- Replace YOUR_FORM_ID with the ID from formspree.io to receive messages in your inbox. -->
<form class="form" action="https://formspree.io/f/xojgpgaj" method="POST">
  <div class="fl"><input name="name" placeholder="Name" required/></div>
  <div class="fl"><input name="email" type="email" placeholder="Email" required/></div>
  <div class="fl"><textarea name="message" rows="4" placeholder="What's this about?" required></textarea></div>
  <div class="center"><button class="btn" type="submit">Send message</button></div>
</form>

<div class="socials">
  <span>YouTube</span>
  <span>Instagram</span>
  <span>LinkedIn</span>
</div>

<footer><div class="wrap"><div>© 2026 Rishabh Jain</div><div>Love what you do, do what you love.</div></div></footer>
</body>
</html>
