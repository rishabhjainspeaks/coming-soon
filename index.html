<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Rishabh Jain — Coming Soon</title>
<meta name="description" content="Rishabh Jain — Chartered Accountant, speaker and mentor. Website launching soon."/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#ffffff;--bg2:#f5f5f7;--ink:#1d1d1f;--gray:#6e6e73;--blue:#0066cc;--line:#d2d2d7}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}

nav{position:sticky;top:0;z-index:50;backdrop-filter:saturate(180%) blur(20px);background:rgba(251,251,253,.8);border-bottom:1px solid rgba(0,0,0,.08)}
nav .in{max-width:980px;margin:0 auto;padding:0 22px;height:48px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:15px;font-weight:600;letter-spacing:-.01em}
.tabs{display:flex;gap:28px}
.tab{font-size:12.5px;color:rgba(29,29,31,.8);padding:4px 0}
.tab.on{color:var(--ink);font-weight:600}

main{flex:1;display:grid;place-items:center;padding:40px 24px;text-align:center}
.hey{font-size:20px;font-weight:700;margin-bottom:14px;color:var(--gray)}
h1{font-size:clamp(40px,7vw,64px);font-weight:800;letter-spacing:-.03em;line-height:1.05;margin-bottom:18px}
.hl{position:relative;white-space:nowrap}
.hl::after{content:"";position:absolute;left:-2px;right:-2px;bottom:6px;height:14px;background:#ffd66b;z-index:-1;border-radius:3px;transform:rotate(-1deg)}
p.sub{font-size:17.5px;color:var(--gray);max-width:460px;margin:0 auto 30px;line-height:1.55}
.cta{display:inline-block;background:var(--blue);color:#fff;font-weight:700;font-size:15px;padding:12px 26px;border-radius:999px;transition:.2s}
.cta:hover{background:#0055b0}

footer{border-top:1px solid var(--line);padding:22px 0;background:var(--bg2);text-align:center;font-size:12px;color:var(--gray)}
</style>
</head>
<body>
<nav><div class="in">
  <div class="logo">Rishabh Jain</div>
  <div class="tabs">
    <span class="tab on">Home</span>
    <a class="tab" href="contact.html">Get in touch</a>
  </div>
</div></nav>

<main>
  <div>
    <div class="hey">Hey Friends 👋</div>
    <h1>Something's <span class="hl">coming.</span></h1>
    <p class="sub">Chartered Accountant · Speaker · Mentor. The full site is under construction — say hello in the meantime.</p>
    <a class="cta" href="contact.html">Get in touch</a>
  </div>
</main>

<footer>© 2026 Rishabh Jain · rishabhjainspeaks.com</footer>
</body>
</html>
